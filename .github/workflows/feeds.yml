# Footer "Tech talk" widget: refreshes src/data/feeds.js from the RSS feeds
# listed in scripts/fetch-feeds.mjs. A static site can't read other sites'
# RSS from the browser (CORS), so the fetching happens here instead.
name: Tech talk – flux RSS

on:
  schedule:
    - cron: "17 */4 * * *" # every 4 hours (minute 17 avoids the top-of-hour rush)
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: write # needed to commit the updated feeds.js

concurrency:
  group: tech-talk-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch feeds
        run: node scripts/fetch-feeds.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- src/data/feeds.js)" ]; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/feeds.js
          git commit -m "Tech talk : mise à jour des flux RSS"
          git push
