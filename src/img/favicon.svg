<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- "N" monogram, ardoise palette: drawn as shapes so it doesn't depend on a font -->
  <rect width="64" height="64" rx="14" fill="#313E50"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#455561" stroke-width="2"/>
  <g fill="#8EAAE3">
    <!-- left stem + bottom serif -->
    <rect x="17" y="15" width="5.5" height="34"/>
    <rect x="11.5" y="45.5" width="16.5" height="3.5"/>
    <!-- thick diagonal, Didone-style contrast -->
    <polygon points="11.5,15 26,15 47,49 37.5,49"/>
    <!-- right stem + top serif -->
    <rect x="41.5" y="15" width="5.5" height="34"/>
    <rect x="36" y="15" width="16.5" height="3.5"/>
  </g>
</svg>
