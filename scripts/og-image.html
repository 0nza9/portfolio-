<!DOCTYPE html>
<html lang="fr">
<head>
<!-- Source of src/img/og-image.png (link preview, 1200×630). To regenerate from the repo root:
     "/c/Program Files (x86)/Microsoft/Edge/Application/msedge.exe" --headless=new --hide-scrollbars        --allow-file-access-from-files --window-size=1200,630 --virtual-time-budget=8000        --screenshot="$(cygpath -w "$PWD")\src\img\og-image.png" "file:///$(cygpath -m "$PWD")/scripts/og-image.html"
     then check the image and push. -->
<meta charset="UTF-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&display=block" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: Inter, sans-serif;
    color: #E6E8EE;
    background: #313E50;
  }
  .bg {
    position: absolute; inset: -40px;
    background: url("../src/img/bg-hero.avif") center / cover;
    filter: blur(14px) saturate(0.9);
  }
  .tint {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgb(49 62 80 / 0.72), rgb(58 67 94 / 0.55) 55%, rgb(49 62 80 / 0.8));
  }
  .card {
    position: absolute; inset: 56px;
    display: flex; align-items: center; gap: 56px;
    padding: 56px 64px;
    border-radius: 28px;
    background: linear-gradient(135deg, rgb(255 255 255 / 0.10), rgb(255 255 255 / 0.03));
    border: 1px solid rgb(255 255 255 / 0.18);
    box-shadow: 0 30px 60px -20px rgb(0 0 0 / 0.5), inset 0 1px 0 rgb(255 255 255 / 0.12);
    backdrop-filter: blur(18px);
  }
  .avatar {
    flex: none;
    width: 230px; height: 230px; border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 0 6px #455561, 0 20px 40px -10px rgb(0 0 0 / 0.6);
  }
  .avatar img {
    width: 100%; height: 100%; object-fit: cover;
    object-position: 31% 50%;
    transform: scale(1.4); transform-origin: 50% 41%;
  }
  .text { min-width: 0; }
  .kicker {
    font-family: "JetBrains Mono", monospace; font-size: 20px;
    letter-spacing: 0.22em; text-transform: uppercase; color: #8EAAE3;
  }
  h1 {
    font-family: Fraunces, serif; font-weight: 300; font-optical-sizing: auto;
    font-size: 76px; line-height: 1.05; margin: 14px 0 18px;
  }
  h1 span { color: #8EAAE3; }
  .role { font-size: 28px; opacity: 0.92; white-space: nowrap; }
  .row { display: flex; align-items: center; gap: 22px; margin-top: 34px; }
  .pill {
    font-family: "JetBrains Mono", monospace; font-size: 20px;
    padding: 12px 22px; border-radius: 999px;
    background: #8EAAE3; color: #1f2836; font-weight: 500;
  }
  .logos { display: flex; gap: 10px; }
  .logos span {
    display: inline-flex; padding: 9px; border-radius: 12px;
    background: rgb(49 62 80 / 0.55); border: 1px solid rgb(230 232 238 / 0.12);
  }
  .logos img { width: 30px; height: 30px; }
  .url {
    position: absolute; right: 64px; bottom: 26px;
    font-family: "JetBrains Mono", monospace; font-size: 18px;
    letter-spacing: 0.06em; color: rgb(230 232 238 / 0.7);
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="tint"></div>
  <div class="card">
    <div class="avatar"><img src="../src/img/photo-nathan.webp" alt="" /></div>
    <div class="text">
      <p class="kicker">Portfolio · Onza</p>
      <h1>Salut, moi c’est <span>Nathan</span>&nbsp;!</h1>
      <p class="role">Développeur front &amp; back · BTS SIO SLAM</p>
      <div class="row">
        <span class="pill">Recherche une alternance</span>
        <div class="logos">
          <span><img src="../src/img/skills/nodejs.svg" alt="" /></span>
          <span><img src="../src/img/skills/typescript.svg" alt="" /></span>
          <span><img src="../src/img/skills/postgresql.svg" alt="" /></span>
          <span><img src="../src/img/skills/docker.svg" alt="" /></span>
          <span><img src="../src/img/skills/discord.svg" alt="" /></span>
        </div>
      </div>
    </div>
  </div>
  <p class="url">enguehardnathan.netlify.app</p>
</body>
</html>
